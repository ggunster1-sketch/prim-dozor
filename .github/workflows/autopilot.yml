name: PrimDozor Autopilot 24/7
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: autopilot
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Автоисправление контактов и языка перед сборкой
        run: |
          for f in template.html sitegen.js config.js bot.js index.html; do
            if [ -f "$f" ]; then
              sed -i 's/231-09-08/249-09-21/g' "$f"
              sed -i 's/Читайте нас in Telegram/Читайте нас в Телеграм/g' "$f"
              sed -i 's/Читайте нас в Telegram/Читайте нас в Телеграм/g' "$f"
              sed -i 's/Читайте нас в MAX/Читайте нас в МАКС/g' "$f"
              sed -i 's/<html lang="ru">/<html lang="ru" translate="no" class="notranslate">/g' "$f"
            fi
          done
      - env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: node bot.js
      - run: |
          git config user.name "ggunster1-sketch"
          git config user.email "ggunster1@gmail.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update" && git pull --rebase origin main && git push)
