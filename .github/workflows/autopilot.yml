name: PrimDozor Autopilot 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node bot.js

      - name: Commit and push updates
        run: |
          git config user.name "PrimDozor Bot"
          git config user.email "ggunster1-sketch@users.noreply.github.com"
          git add news.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news" && git push)
