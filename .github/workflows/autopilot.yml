name: Восстановление проекта
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Автоматический откат до чистки
        run: |
          git config user.name "ggunster1-sketch"
          git config user.email "ggunster1@gmail.com"
          TARGET=$(git rev-list -n 1 --before="2026-11-24 14:00:00 UTC" main)
          git reset --hard "$TARGET"
          git push --force origin main
