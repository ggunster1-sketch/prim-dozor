name: Восстановление проекта
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Восстановление всех файлов из b6e274d
        run: |
          git config user.name "ggunster1-sketch"
          git config user.email "ggunster1@gmail.com"
          git rm -rf --ignore-unmatch .
          git checkout b6e274d -- .
          git checkout HEAD -- .github/workflows/autopilot.yml
          git add -A
          git commit -m "Полное восстановление проекта из b6e274d"
          git push origin main
