name: PrimDozor Autopilot 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: autopilot-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean old node_modules from git
        run: |
          git rm -rf --cached node_modules || true

      - name: Install dependencies
        run: npm install canvas

      - name: Run news bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node bot.js

      - name: Commit and push updates
        run: |
          git config user.name "PrimDozor Bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto update site & news"
            git pull --rebase origin main
            git push
          fi
